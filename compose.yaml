name: database-systems-term-project
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fulfillment
      POSTGRES_USER: fulfillment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-database.mjs first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fulfillment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillment -d fulfillment"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  fulfillment_data:
